<svg xmlns="http://www.w3.org/2000/svg" width="880" height="302" viewBox="0 0 880 302" role="img" aria-label="fix.me.at at a glance: Keep your Sentry SDK, Issues, not just events, Storm-capped ingest, Scrubbed before stored">
<rect x="0.5" y="0.5" width="879" height="301" rx="12" fill="#ffffff" stroke="#e5e5e5"/>
<rect x="24" y="24" width="196" height="254" rx="10" fill="#fafafa" stroke="#e5e5e5"/>
<text x="44" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#a3a3a3">01</text>
<line x1="72" y1="56" x2="200" y2="56" stroke="#d4d4d4" stroke-width="1"/>
<text x="44" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#0a0a0a" font-weight="600"><tspan x="44" dy="0">Keep your</tspan><tspan x="44" dy="22">Sentry SDK</tspan></text>
<text x="44" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#525252"><tspan x="44" dy="0">Point the @sentry/*</tspan><tspan x="44" dy="21">SDK you already ship</tspan><tspan x="44" dy="21">at a new DSN. The</tspan><tspan x="44" dy="21">SDK, its version and</tspan><tspan x="44" dy="21">your hooks stay as</tspan><tspan x="44" dy="21">they are.</tspan></text>
<rect x="236" y="24" width="196" height="254" rx="10" fill="#fafafa" stroke="#e5e5e5"/>
<text x="256" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#a3a3a3">02</text>
<line x1="284" y1="56" x2="412" y2="56" stroke="#d4d4d4" stroke-width="1"/>
<text x="256" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#0a0a0a" font-weight="600"><tspan x="256" dy="0">Issues, not</tspan><tspan x="256" dy="22">just events</tspan></text>
<text x="256" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#525252"><tspan x="256" dy="0">Events group into</tspan><tspan x="256" dy="21">issues by</tspan><tspan x="256" dy="21">fingerprint, with</tspan><tspan x="256" dy="21">counts, release and</tspan><tspan x="256" dy="21">environment tags, and</tspan><tspan x="256" dy="21">a triage workflow.</tspan></text>
<rect x="448" y="24" width="196" height="254" rx="10" fill="#fafafa" stroke="#e5e5e5"/>
<text x="468" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#a3a3a3">03</text>
<line x1="496" y1="56" x2="624" y2="56" stroke="#d4d4d4" stroke-width="1"/>
<text x="468" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#0a0a0a" font-weight="600"><tspan x="468" dy="0">Storm-capped</tspan><tspan x="468" dy="22">ingest</tspan></text>
<text x="468" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#525252"><tspan x="468" dy="0">Rate limits, a</tspan><tspan x="468" dy="21">monthly allowance, a</tspan><tspan x="468" dy="21">shared ceiling and a</tspan><tspan x="468" dy="21">kill switch. Over the</tspan><tspan x="468" dy="21">limit is a 429, never</tspan><tspan x="468" dy="21">a bill.</tspan></text>
<rect x="660" y="24" width="196" height="254" rx="10" fill="#fafafa" stroke="#e5e5e5"/>
<text x="680" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#a3a3a3">04</text>
<line x1="708" y1="56" x2="836" y2="56" stroke="#d4d4d4" stroke-width="1"/>
<text x="680" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#0a0a0a" font-weight="600"><tspan x="680" dy="0">Scrubbed before</tspan><tspan x="680" dy="22">stored</tspan></text>
<text x="680" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#525252"><tspan x="680" dy="0">Headers, cookies and</tspan><tspan x="680" dy="21">stack-frame locals</tspan><tspan x="680" dy="21">are scrubbed on the</tspan><tspan x="680" dy="21">server before</tspan><tspan x="680" dy="21">anything is</tspan><tspan x="680" dy="21">persisted.</tspan></text>
</svg>
